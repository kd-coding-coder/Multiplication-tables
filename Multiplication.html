<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Multiplication Table</title>

        <style>
            body{
                background-color: rgb(255, 243, 245);
                padding: 20px;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }

            .container{
                max-width: 600px;
                margin-top: 50px;
                padding: 30px;
                background-color: rgb(251, 214, 220);
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(rgb(165, 102, 167));
            }

            h2{
                color: rgb(49, 1, 49);
                margin-bottom: 20px;
            }

            label{
                font-size: 1.1rem;
                color: rgb(60, 56, 152);
                font-weight: 500;
            }

            .form-control {
                border-radius: 10px;
                border: 2px solid rgb(192, 255, 249);
                transition: border-color 0.3s;
            }

            .form-control:focus{
                border-color: aqua;
                box-shadow: 0 0 5px rgba(rgb(9, 162, 162));
            }

            .btn-primary{
                background-color:rgb(184, 255, 248) ;
                border-color:pink;
                border-radius: 10px;
                font-weight: 600;
            }

            #tableResult {
                margin-top: 20px;
                font-size: 1.2rem;
                font-weight: 600;
                color: cornflowerblue;
                text-align: center;
            }

            #tableResult h3{
                color: rgb(43, 43, 75);
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            #tableResult ul{
                list-style-type:none;
                padding: 0;
            }

            #tableResult li{
                font-size: 1.2rem;
                color: cornflowerblue;
                padding: 5px 0;
            }

            #tableResuly li:nth-child(even) {
                background-color: rgb(246, 232, 255);
                border-radius: 5px;
            }

            #tableResult li:hover{
                background-color: rgb(204, 167, 239);
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h2 class="text-center">Multiplication Table</h2>
            <form id="tableform">
                <div class="form-group mb-4">
                    <label for="number">Enter a Number:</label>
                    <input type="number" id="number" class="form-control" placeholder="Enter a Number" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Generate Table</button>
            </form>

            <div id="tableResult"></div>
        </div>

        <script>
            function generateTable() {
                const number = document.getElementById("number").value;
                const tableResult = document.getElementById("tableResult");

                if(number) {
                    let tableHTML = `<h3>Multiplication Table for ${number}</h3>`;
                    tableHTML += "<ul>";

                        for(let i = 1; i <= 10; i++){
                            tableHTML += `<li>${number} x ${i} = ${number*i}</li>`;
                        }

                        tableHTML += "<ul>";
                        tableResult.innerHTML = tableHTML;
                }else{
                    tableResult.innerHTML = "<p>Please enter a valid number.</p>";
                }
            }

            document.getElementById("tableform").addEventListener("submit", function(event){
                event.preventDefault();
                generateTable();
            });
        </script>


    </body>
</html>
